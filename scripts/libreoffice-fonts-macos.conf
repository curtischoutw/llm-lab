<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
macOS 上 headless LibreOffice 用的 fontconfig 設定，讓 Office 文件轉 PDF 時中文不會消失。

為什麼存在：RAG-Anything 匯入 Office 文件時，先用 headless LibreOffice 轉成 PDF。
headless 模式的 LibreOffice 透過 fontconfig 找字型，預設只看得到 LibreOffice 內附的字型，
內附字型沒有中文字型，所以中文字不會畫進 PDF。2026-10-30 實測（LibreOffice 26.8.1.1，Homebrew）：
- 權益子頁 right0201 的 docx 有 7,309 個中文字，沒有這份設定時轉出的 PDF 中文是 0 字；
- 用 FONTCONFIG_FILE 指到這份設定後是 7,265 字，缺字由系統字型（Hiragino Sans、Arial Unicode MS）補上。
另外安裝 Noto Sans CJK TC 但不改 fontconfig 時，中文仍然是 0 字。

用法：在 .env 加上 FONTCONFIG_FILE=<這個檔案的絕對路徑>（見 .env.example）。
rag_lab 用 load_dotenv 把它放進環境變數，LibreOffice 子行程會繼承。

已知極限：LibreOffice 要裝在 /Applications/LibreOffice.app，否則內附字型的路徑要改。
-->
<fontconfig>
  <dir>/Applications/LibreOffice.app/Contents/Resources/fonts/truetype</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
